<style>
  :root { --green:#2F7D6E; --ink:#14302A; --paper:#F4F8F6; --light:#55736A; --border:#D8E3DE; --tint:#DCEBE5; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font:400 17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:64px 24px; }
  h1 { font-size:31px; margin:0 0 8px; letter-spacing:-.01em; }
  h2 { font-size:20px; margin:34px 0 8px; letter-spacing:-.01em; }
  p { color:var(--light); margin:0 0 26px; }
  h2 + p, h2 + ul { margin-bottom:18px; }
  ul { color:var(--light); margin:0 0 26px; padding-left:22px; }
  li { margin:0 0 8px; }
  a.block { color:var(--green); display:block; margin:0 0 12px; font-weight:650; }
  p a, li a { color:var(--green); font-weight:650; }
  .wrap > p, .wrap > h2, .wrap > ul, #adventure,
  section[aria-labelledby="adventure"] > p, section[aria-labelledby="adventure"] > ul { max-width:640px; }
  .logo { display:block; width:230px; max-width:100%; height:auto; margin-bottom:24px; }
  .lede { font-size:20px; color:var(--ink); max-width:640px; }
  .get { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; }
  /* Apple's badge, unaltered. The padding is the clear space their guidelines require:
     at least a tenth of the badge's height on every side. */
  a.badge { display:inline-block; padding:6px; }
  a.badge img { display:block; height:52px; width:auto; }
  /* Google's PNG has 41px of built-in clear space on a 250px height; 77px puts its artwork at 52px, level with Apple's. */
  a.badge.play { padding:0; vertical-align:middle; }
  a.badge.play img { height:77px; width:auto; }
  a.badge:active { opacity:.85; }
  .soon { color:var(--light); font-size:15px; margin:0; }
  .gallery { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; margin:32px 0 40px; }
  figure { margin:0; min-width:0; }
  .gallery a { display:block; border-radius:18px; overflow:hidden; box-shadow:0 8px 24px #14302a18; }
  .gallery img { display:block; width:100%; height:auto; }
  figcaption { margin-top:12px; font-size:16px; color:var(--ink); font-weight:600; }
  .rule { border:0; border-top:1px solid var(--border); margin:48px 0 0; max-width:640px; }
  .cards { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:18px; margin:24px 0 32px; }
  .cards img { display:block; width:100%; height:auto; border-radius:14px;
    box-shadow:0 6px 18px #14302a14; }
  .items { display:flex; flex-wrap:wrap; align-items:center; gap:26px; margin:24px 0 8px; }
  .items img { display:block; width:72px; height:72px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; margin:0 0 36px; }
  .top .logo { margin:0; width:150px; }
  .top nav { display:flex; flex-wrap:wrap; gap:6px 22px; }
  .top nav a { color:var(--green); font-weight:650; font-size:16px; }
  .kicker { font-size:16px; margin:0 0 26px; }
  .also { margin:0 0 26px; font-size:17px; }
  .also a { color:var(--green); font-weight:650; }
  .plans { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:20px 0 26px; max-width:860px; }
  .plan { border:1px solid var(--border); border-radius:14px; padding:18px 20px; background:#fff; }
  .plan.pick { border:2px solid var(--green); }
  .plan h3 { font-size:18px; margin:0 0 4px; }
  .plan .price { color:var(--ink); font-weight:650; margin:0 0 10px; }
  .plan p { margin:0 0 10px; font-size:16px; }
  .plan .tag { display:inline-block; background:var(--green); color:#fff; font-size:13px; font-weight:650; border-radius:999px; padding:2px 10px; margin:0 0 8px; }
  table.compare { border-collapse:collapse; width:100%; max-width:860px; margin:0 0 26px; font-size:16px; }
  table.compare th, table.compare td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--light); }
  table.compare th { color:var(--ink); }
  a:focus-visible { outline:3px solid var(--green); outline-offset:5px; }
  footer { margin-top:56px; padding-top:18px; border-top:1px solid var(--tint);
    color:var(--light); font-size:14px; }
  @media (max-width:600px) {
    .wrap { padding:32px 20px; }
    .gallery { grid-template-columns:1fr; max-width:360px; margin-inline:auto; gap:28px; }
    .cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .items { gap:20px; justify-content:center; }
    .plans { grid-template-columns:1fr; }
  }
</style>
<style>

  .posts h2 a { color:var(--ink); text-decoration:none; }
  .posts h2 a:hover { color:var(--green); text-decoration:underline; }

  article img { max-width:100%; height:auto; border-radius:12px; }
  article blockquote { margin:0 0 26px; padding-left:16px; border-left:3px solid var(--tint); }
  article code { background:var(--tint); border-radius:4px; padding:1px 5px; font-size:.92em; }
  article pre { background:var(--tint); border-radius:10px; padding:14px 16px; overflow-x:auto; margin:0 0 26px; }
  article pre code { background:none; padding:0; }
  article ol { color:var(--light); margin:0 0 26px; padding-left:22px; }
  .byline { margin:0 0 28px; }
